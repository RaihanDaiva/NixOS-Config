# ==========================================
# Foot Terminal Configuration with Pywal
# ==========================================

[main]
include=~/.cache/wal/colors-foot-dark.ini
font=JetBrainsMono Nerd Font:size=11
pad=0x0

[bell]
urgent=no
notify=no

[scrollback]
lines=10000

[cursor]
style=block
blink=no
